<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>47都道府県ガイド</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body class="page-home">

  <div class="page-wrapper">

    <!-- 白いコンテンツボックス -->
    <div class="content-box">

      <!-- 日本地図＋地方選択ボタン -->
      <div class="map-container">

        <img
          src="./images/日本地図_メインページ画像.png"
          alt="日本地図 — 地方を選んでください"
          class="map-image"
          id="main-map"
        >

        <!-- 北海道・東北 -->
        <a
          href="./hokkaido_tohoku.html"
          class="region-btn btn-hokkaido-tohoku"
          id="hokkaido-tohoku-link"
          aria-label="北海道・東北地方を選ぶ"
        >
          北海道・東北
        </a>

        <!-- 関東 -->
        <a
          href="./test.html"
          class="region-btn btn-kanto"
          aria-label="関東地方を選ぶ"
        >
          関東
        </a>

        <!-- 中部 -->
        <a
          href="./test.html"
          class="region-btn btn-chubu"
          aria-label="中部地方を選ぶ"
        >
          中部
        </a>

        <!-- 近畿 -->
        <a
          href="./test.html"
          class="region-btn btn-kinki"
          aria-label="近畿地方を選ぶ"
        >
          近畿
        </a>

        <!-- 中国・四国 -->
        <a
          href="./test.html"
          class="region-btn btn-chugoku-shikoku"
          aria-label="中国・四国地方を選ぶ"
        >
          中国・四国
        </a>

        <!-- 九州 -->
        <a
          href="./test.html"
          class="region-btn btn-kyushu"
          aria-label="九州地方を選ぶ"
        >
          九州
        </a>

      </div>

    </div>

  </div>

  <!-- GSAPライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

  <!-- 自作JavaScript -->
  <script src="./script.js"></script>

</body>
</html>
