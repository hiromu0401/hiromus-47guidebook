<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北海道・東北 | 47都道府県ガイド</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="page-tohoku">
  <div class="page-wrapper">

    <!-- 白いコンテンツボックス -->
    <div class="content-box region-content-box">

      <!-- 左上の装飾 -->
      <img
        src="./images/北海道・東北_左上.png"
        alt=""
        class="corner-decoration corner-top-left"
        aria-hidden="true"
      >

      <!-- 右上の装飾 -->
      <img
        src="./images/北海道・東北_右上.png"
        alt=""
        class="corner-decoration corner-top-right"
        aria-hidden="true"
      >

      <!-- 左下の装飾 -->
      <img
        src="./images/北海道・東北_左下.png"
        alt=""
        class="corner-decoration corner-bottom-left"
        aria-hidden="true"
      >

      <!-- 右下の装飾 -->
      <img
        src="./images/北海道・東北_右下.png"
        alt=""
        class="corner-decoration corner-bottom-right"
        aria-hidden="true"
      >

      <!-- 地方名の見出し -->
      <div class="region-heading">
        <p>✦北海道・東北地方✦</p>
      </div>

      <!-- 北海道・東北地図＋都道県選択ボタン -->
      <div class="map-container">
        <img
          src="./images/日本地図_北海道・東北画像.png"
          alt="北海道・東北地方の地図 — 都道県を選んでください"
          class="map-image"
        >

        <a
          href="./hokkaido.html"
          class="region-btn prefecture-btn btn-hokkaido"
          data-fade-link
        >北海道</a>

        <a
          href="./test.html"
          class="region-btn prefecture-btn btn-aomori"
        >青森</a>

        <a
          href="./test.html"
          class="region-btn prefecture-btn btn-akita"
        >秋田</a>

        <a
          href="./test.html"
          class="region-btn prefecture-btn btn-iwate"
        >岩手</a>

        <a
          href="./test.html"
          class="region-btn prefecture-btn btn-miyagi"
        >宮城</a>

        <a
          href="./test.html"
          class="region-btn prefecture-btn btn-fukushima"
        >福島</a>

        <a
          href="./test.html"
          class="region-btn prefecture-btn btn-yamagata"
        >山形</a>

      </div>
    </div>

    <!-- 白枠の外側：メインページに戻る -->
    <div class="page-back-area">
      <a
        href="./index.html"
        class="back-btn"
        data-fade-link
      >メインページに戻る</a>
    </div>

  </div>

  <!-- GSAPライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

  <!-- 自作JavaScript -->
  <script src="./script.js"></script>
</body>
</html>
