<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北海道 | 47都道府県ガイド</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="page-hokkaido">
  <div class="page-wrapper">
    <main class="content-box hokkaido-content">
      <!-- 北海道ロゴ -->
      <div class="prefecture-logo">
        <img src="./images/北海道ロゴ.png" alt="北海道のロゴ">
      </div>
      <!-- 観光スポット名 -->
      <h1 class="spot-title">知床</h1>
      <!-- 観光スポット画像 -->
      <div class="spot-image">
        <img src="./images/北海道.png" alt="北海道・知床の風景">
      </div>
      <!-- 住所 -->
      <div class="spot-address">
        <p>北海道斜里郡斜里町ウトロ西187-8</p>
      </div>
      <!-- 観光スポット説明 -->
      <div class="spot-description">
        <p>
          アイヌ語で「地の果て」を意味する「シリエトク」が派生して今の名前になったとされる、北海道の北東に位置する知床半島。ここは世界で最も低緯度の流水が流れ着くポイントとしても知られており、冬期には流氷がこの地域を覆う。流氷ウォークでは、専用のドライスーツを着て歩く体験ができる。
        </p>
      </div>
      <!-- 北海道・東北ページに戻る -->
      <div class="page-back-area">
        <a href="./hokkaido_tohoku.html" class="back-btn" data-fade-link>北海道・東北ページに戻る</a>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
