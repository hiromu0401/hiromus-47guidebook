  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="page-hokkaido">
  <div class="page-wrapper">
    <main class="content-box hokkaido-content">
      <!-- 北海道ロゴ -->
      <div class="prefecture-logo">
        <img src="./images/北海道ロゴ.png" alt="北海道のロゴ">
      </div>
      <!-- 観光スポット名 -->
      <h1 class="spot-title">知床</h1>
      <!-- 観光スポット画像＋キャラクター -->
<div class="spot-image">
  <!-- 観光スポット画像 -->
  <img
    src="./images/北海道.png"
    alt="北海道・知床の風景"
    class="spot-photo"
  >
  <!-- キャラクターイラスト -->
  <img
    src="./images/フライトキャップむう.png"
    alt="むう"
    class="spot-character"
  >
</div>
      <!-- 住所 -->
      <div class="spot-address">
        <p>北海道斜里郡斜里町ウトロ西187-8</p>
      </div>
      <!-- 観光スポット説明 -->
      <div class="spot-description">
        <p>
          アイヌ語で「地の果て」を意味する「シリエトク」 が派生して今の名前になったとされる、北海道の北東に位置する知床半島。ここは世界で最も低緯度の流氷が流れ着くポイントとしても知られており、冬期には流れ着いた流氷の上を専用のドライスーツを着て歩く「流氷ウォーク」を体験できる。知床の流氷は、ロシアのアムール川の水が凍って出来た氷であり、運が良ければロシアから乗ってきた野生のアザラシが運ばれてくることもあるそう。地球温暖化の影響で流氷は年々減少しているため、興味のある方はぜひ早いうちに。
        </p>
      </div>

      </div>
